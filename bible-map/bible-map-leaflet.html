<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblical Lands & Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --parchment:#e9dcbd;
    --ink:#2e2416;
    --sepia:#6b4a2f;
    --sepia-soft:#8a6a48;
    --gold:#c0932f;
    --gold-bright:#e0b74f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'EB Garamond', serif;
    background:#1c140c;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width:1400px;
    margin:0 auto;
    background:var(--parchment);
    box-shadow:0 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  header{
    padding:16px 28px 9px;
    text-align:center;
    border-bottom:1px solid rgba(107,74,47,0.35);
    background:linear-gradient(180deg, rgba(0,0,0,0.06), transparent);
    flex-shrink:0;
  }
  header h1{
    font-family:'Cinzel Decorative', 'Cinzel', serif;
    font-weight:700;
    font-size:clamp(19px, 3vw, 30px);
    letter-spacing:2px;
    margin:0;
  }
  header p{
    font-family:'Cinzel', serif;
    font-size:10.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--sepia);
    margin:4px 0 0;
  }

  .stage{ flex:1; display:flex; min-height:0; position:relative; }
  .map-wrap{ flex:1; position:relative; min-width:0; }
  #leafletMap{ width:100%; height:100%; background:#dcd0ac; }

  /* tint the real tiles toward the parchment palette */
  #leafletMap .leaflet-tile-pane{
    filter:sepia(0.45) saturate(1.25) brightness(0.97) hue-rotate(-8deg) contrast(1.02);
  }
  #leafletMap .leaflet-control-attribution{
    font-family:'EB Garamond', serif;
    font-size:10px;
    background:rgba(233,220,189,0.85);
  }

  .place-popup .leaflet-popup-content-wrapper{
    background:var(--parchment);
    border:1px solid rgba(107,74,47,0.4);
    border-radius:3px;
  }
  .place-popup .leaflet-popup-tip{ background:var(--parchment); }
  .popup-name{
    font-family:'Cinzel', serif;
    font-size:14px;
    letter-spacing:0.5px;
    margin:0 0 4px;
  }
  .popup-blurb{ font-size:14px; color:var(--sepia); line-height:1.4; margin:0; }

  #panel{
    width:280px;
    flex-shrink:0;
    border-left:1px solid rgba(107,74,47,0.35);
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.03));
    padding:22px 20px;
    overflow-y:auto;
  }
  #panel .eyebrow{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
  }
  #panel h2{
    font-family:'Cinzel', serif;
    font-size:22px;
    margin:0 0 10px;
    border-bottom:1px solid rgba(107,74,47,0.3);
    padding-bottom:10px;
  }
  #panel p{ font-size:16px; line-height:1.55; color:var(--sepia); margin:0 0 14px; }
  #panel .era-tag{
    display:inline-block;
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:1px;
    padding:4px 9px;
    margin:2px 4px 2px 0;
    border-radius:2px;
    color:var(--parchment);
    opacity:0.9;
  }
  #panel .empty{
    color:var(--sepia-soft);
    font-style:italic;
    font-size:15px;
    margin-top:40px;
    text-align:center;
  }
  #panel .coords{
    font-family:'Cinzel', serif;
    font-size:10px;
    color:var(--sepia-soft);
    letter-spacing:1px;
    margin-top:20px;
  }

  .timeline{
    flex-shrink:0;
    border-top:1px solid rgba(107,74,47,0.4);
    background:linear-gradient(0deg, rgba(0,0,0,0.08), transparent);
    padding:12px 16px 14px;
  }
  .timeline-inner{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .era-tab{
    flex:0 0 auto;
    cursor:pointer;
    border:1px solid rgba(107,74,47,0.4);
    background:rgba(255,255,255,0.15);
    border-radius:3px;
    padding:7px 12px 6px;
    text-align:left;
    min-width:108px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    position:relative;
  }
  .era-tab::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--swatch, var(--sepia));
    border-radius:3px 0 0 3px;
  }
  .era-tab .name{ display:block; font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.5px; margin-bottom:2px; }
  .era-tab .range{ display:block; font-size:12px; color:var(--sepia); font-style:italic; }
  .era-tab:hover{ transform:translateY(-2px); }
  .era-tab.active{
    background:rgba(192,147,47,0.22);
    box-shadow:0 0 0 1px var(--gold) inset, 0 3px 10px rgba(0,0,0,0.15);
    transform:translateY(-2px);
  }
  .era-tab.all{ min-width:74px; text-align:center; }
  .era-tab.all::before{ display:none; }

  .timeline-inner::-webkit-scrollbar{ height:6px; }
  .timeline-inner::-webkit-scrollbar-thumb{ background:var(--sepia-soft); border-radius:3px; }
  #panel::-webkit-scrollbar{ width:6px; }
  #panel::-webkit-scrollbar-thumb{ background:var(--sepia-soft); border-radius:3px; }

  @media (max-width: 760px){
    .stage{ flex-direction:column; }
    #panel{ width:100%; border-left:none; border-top:1px solid rgba(107,74,47,0.35); max-height:32vh; }
    .map-wrap{ flex:1 1 50%; }
    header{ padding:10px 16px 7px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Biblical Lands &amp; Times</h1>
    <p>An atlas of scripture, from Ur to Rome</p>
  </header>

  <div class="stage">
    <div class="map-wrap">
      <div id="leafletMap"></div>
    </div>
    <div id="panel">
      <div class="empty">Select a place on the map, or choose an era below, to begin.</div>
    </div>
  </div>

  <div class="timeline">
    <div class="timeline-inner" id="timelineInner"></div>
  </div>
</div>

<script>
/* ---------------- Data ---------------- */

const ERAS = [
  { id:'origins',   name:'Origins',           range:'primeval history', color:'#4a3f2e',
    blurb:'The primeval narratives of creation and the flood, set before any fixed chronology.' },
  { id:'patriarchs', name:'Patriarchs',        range:'c. 2100–1800 BC', color:'#8a6d3b',
    blurb:'Abraham, Isaac, and Jacob journey through Mesopotamia and Canaan; Joseph rises in Egypt.' },
  { id:'exodus',     name:'Exodus',            range:'c. 1450–1400 BC', color:'#b5651d',
    blurb:'Israel leaves slavery in Egypt, crosses the sea, and receives the Law at Sinai.' },
  { id:'conquest',   name:'Conquest & Judges', range:'c. 1400–1050 BC', color:'#a6752c',
    blurb:'Joshua leads Israel into Canaan; the tribes settle the land under a series of judges.' },
  { id:'kingdom-united', name:'United Kingdom', range:'c. 1050–930 BC', color:'#c0932f',
    blurb:'Saul, David, and Solomon rule a single kingdom from Jerusalem.' },
  { id:'kingdom-divided', name:'Divided Kingdom', range:'c. 930–586 BC', color:'#9c5b2e',
    blurb:'The kingdom splits into Israel (north) and Judah (south); Assyria and Babylon rise.' },
  { id:'exile',      name:'Exile',             range:'586–538 BC', color:'#5b4636',
    blurb:'Jerusalem falls to Babylon and Judah\u2019s people are carried into exile.' },
  { id:'return',     name:'Return',            range:'538–4 BC', color:'#7a6a4f',
    blurb:'Exiles return under Persian rule and rebuild Jerusalem and its Temple.' },
  { id:'jesus',      name:'Life of Jesus',     range:'c. 4 BC–AD 30', color:'#8b2e1f',
    blurb:'Jesus\u2019 birth, ministry in Galilee and Judea, death, and resurrection.' },
  { id:'apostolic',  name:'Early Church',      range:'AD 30–95', color:'#a83a2c',
    blurb:'The apostles and Paul carry the gospel from Jerusalem to Rome.' },
];
const ERA_MAP = Object.fromEntries(ERAS.map(e => [e.id, e]));

// real latitude/longitude for every place
const PLACES = [
  { name:'Mount Ararat', lat:39.7, lng:44.3, eras:['origins'],
    blurb:'Traditional resting place of Noah\u2019s ark after the flood waters receded.' },
  { name:'Ur', lat:30.9626, lng:46.1088, eras:['patriarchs'],
    blurb:'The Mesopotamian city Abraham left behind at God\u2019s call to journey toward Canaan.' },
  { name:'Haran', lat:36.86, lng:39.03, eras:['patriarchs'],
    blurb:'A way-station where Abraham\u2019s family settled for a time before he continued on alone.' },
  { name:'Shechem', lat:32.2136, lng:35.2778, eras:['patriarchs','conquest'],
    blurb:'Abraham\u2019s first stop in Canaan; centuries later, where Joshua renewed Israel\u2019s covenant.' },
  { name:'Bethel', lat:31.9306, lng:35.2261, eras:['patriarchs'],
    blurb:'Where Jacob dreamed of a stairway reaching to heaven.' },
  { name:'Hebron', lat:31.5326, lng:35.0998, eras:['patriarchs','kingdom-united'],
    blurb:'Burial place of Abraham, Isaac, and Jacob, and David\u2019s first capital before Jerusalem.' },
  { name:'Memphis', lat:29.85, lng:31.25, eras:['patriarchs','exodus'],
    blurb:'A major Egyptian center near where Joseph rose to power, and Israel later suffered bondage.' },
  { name:'Goshen', lat:30.8, lng:31.7, eras:['patriarchs','exodus'],
    blurb:'The fertile Nile-delta land Israel settled under Joseph, and left behind at the Exodus.' },
  { name:'Sea of Reeds crossing', lat:29.9, lng:32.6, eras:['exodus'],
    blurb:'Traditional site of Israel\u2019s crossing out of slavery and into the wilderness.' },
  { name:'Mount Sinai', lat:28.5392, lng:33.9734, eras:['exodus'],
    blurb:'Where Moses received the Law after Israel\u2019s escape from Egypt.' },
  { name:'Jericho', lat:31.8667, lng:35.45, eras:['conquest','jesus'],
    blurb:'The first Canaanite city to fall to Joshua; centuries later, a city Jesus passed through.' },
  { name:'Samaria', lat:32.2778, lng:35.1917, eras:['kingdom-divided'],
    blurb:'Capital of the northern kingdom of Israel after the split from Judah.' },
  { name:'Jerusalem', lat:31.7683, lng:35.2137, eras:['kingdom-united','kingdom-divided','exile','return','jesus','apostolic'],
    blurb:'City of David and Solomon\u2019s Temple; the center of worship through exile, return, and into the ministry of Jesus and the early church.' },
  { name:'Damascus', lat:33.5138, lng:36.2765, eras:['kingdom-divided','apostolic'],
    blurb:'Capital of ancient Aram, and the road where Paul\u2019s conversion took place.' },
  { name:'Nineveh', lat:36.3567, lng:43.1544, eras:['kingdom-divided'],
    blurb:'Capital of Assyria, the empire that conquered the northern kingdom \u2014 and the city Jonah was sent to warn.' },
  { name:'Babylon', lat:32.5355, lng:44.4275, eras:['kingdom-divided','exile'],
    blurb:'Capital of the empire that destroyed Jerusalem in 586 BC and carried Judah into exile.' },
  { name:'Susa', lat:32.19, lng:48.26, eras:['return'],
    blurb:'A Persian capital, and the setting of the book of Esther during Jewish life under Persian rule.' },
  { name:'Nazareth', lat:32.6996, lng:35.3035, eras:['jesus'],
    blurb:'The Galilean town where Jesus grew up.' },
  { name:'Bethlehem', lat:31.7054, lng:35.2024, eras:['jesus'],
    blurb:'Birthplace of Jesus, in the ancestral line of David.' },
  { name:'Capernaum', lat:32.8807, lng:35.5753, eras:['jesus'],
    blurb:'A Galilean fishing town that became the base of Jesus\u2019 public ministry.' },
  { name:'Tyre', lat:33.27, lng:35.19, eras:['jesus','apostolic'],
    blurb:'A Phoenician port city Jesus visited, and later a stop on Paul\u2019s travels.' },
  { name:'Antioch', lat:36.2, lng:36.16, eras:['apostolic'],
    blurb:'Where believers were first called Christians, and the launch point for Paul\u2019s missionary journeys.' },
  { name:'Salamis, Cyprus', lat:35.185, lng:33.9, eras:['apostolic'],
    blurb:'The first stop of Paul\u2019s first missionary journey.' },
  { name:'Ephesus', lat:37.9495, lng:27.3417, eras:['apostolic'],
    blurb:'A major city of Paul\u2019s ministry, and recipient of one of his letters.' },
  { name:'Athens', lat:37.9838, lng:23.7275, eras:['apostolic'],
    blurb:'Where Paul addressed the philosophers gathered at the Areopagus.' },
  { name:'Corinth', lat:37.9061, lng:22.9352, eras:['apostolic'],
    blurb:'A cosmopolitan trade city, and recipient of two of Paul\u2019s letters.' },
  { name:'Philippi', lat:41.0138, lng:24.2867, eras:['apostolic'],
    blurb:'The first city in Europe where Paul preached, and recipient of his letter of joy.' },
  { name:'Rome', lat:41.9028, lng:12.4964, eras:['apostolic'],
    blurb:'Capital of the empire, where the book of Acts leaves Paul under house arrest.' },
  { name:'Malta', lat:35.8989, lng:14.5146, eras:['apostolic'],
    blurb:'The island where Paul was shipwrecked on his way to Rome.' },
];

/* ---------------- Map ---------------- */

const map = L.map('leafletMap', { scrollWheelZoom:true, zoomControl:true })
  .setView([34, 33], 5);

L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom:18,
  attribution:'Map tiles &copy; <a href="https://carto.com/attributions">CARTO</a>, data &copy; OpenStreetMap contributors'
}).addTo(map);

const bounds = L.latLngBounds(PLACES.map(p=>[p.lat,p.lng]));
map.fitBounds(bounds, { padding:[30,30] });

function colorFor(p){
  const ntEras = ['jesus','apostolic'];
  return p.eras.some(e=>ntEras.includes(e)) && !p.eras.some(e=>!ntEras.includes(e))
    ? '#8b2e1f' : '#8a6d3b';
}

const markers = {};
PLACES.forEach(p=>{
  const m = L.circleMarker([p.lat,p.lng], {
    radius:7,
    color:'#e9dcbd',
    weight:1.4,
    fillColor:colorFor(p),
    fillOpacity:0.92,
  }).addTo(map);
  m.bindPopup(`<div class="place-popup"><p class="popup-name">${p.name}</p><p class="popup-blurb">${p.blurb}</p></div>`, {className:'place-popup'});
  m.on('click', ()=> selectPlace(p, m));
  markers[p.name] = m;
});

/* ---------------- Timeline UI ---------------- */

const timelineInner = document.getElementById('timelineInner');
let activeEra = null;

const allTab = document.createElement('button');
allTab.className = 'era-tab all active';
allTab.innerHTML = `<span class="name">All Eras</span>`;
allTab.addEventListener('click', ()=> setEra(null));
timelineInner.appendChild(allTab);

ERAS.forEach(era=>{
  const tab = document.createElement('button');
  tab.className = 'era-tab';
  tab.style.setProperty('--swatch', era.color);
  tab.innerHTML = `<span class="name">${era.name}</span><span class="range">${era.range}</span>`;
  tab.addEventListener('click', ()=> setEra(era.id, tab));
  timelineInner.appendChild(tab);
});

function setEra(eraId, tabEl){
  activeEra = eraId;
  [...timelineInner.children].forEach(c=>c.classList.remove('active'));
  (tabEl || allTab).classList.add('active');
  applyFilter();
  if(eraId){
    showEraPanel(ERA_MAP[eraId]);
    const pts = PLACES.filter(p=>p.eras.includes(eraId)).map(p=>[p.lat,p.lng]);
    if(pts.length) map.flyToBounds(L.latLngBounds(pts), { padding:[50,50], duration:0.6 });
  } else {
    showEmptyPanel();
    map.flyToBounds(bounds, { padding:[30,30], duration:0.6 });
  }
}

function applyFilter(){
  PLACES.forEach(p=>{
    const m = markers[p.name];
    if(!activeEra){
      m.setStyle({ radius:7, fillOpacity:0.92, opacity:1, fillColor:colorFor(p) });
      return;
    }
    if(p.eras.includes(activeEra)){
      m.setStyle({ radius:9, fillOpacity:1, opacity:1, fillColor:ERA_MAP[activeEra].color });
      m.bringToFront();
    } else {
      m.setStyle({ radius:5, fillOpacity:0.12, opacity:0.15 });
    }
  });
}

/* ---------------- Detail panel ---------------- */

const panel = document.getElementById('panel');

function showEmptyPanel(){
  panel.innerHTML = `<div class="empty">Select a place on the map, or choose an era below, to begin.</div>`;
}

function showEraPanel(era){
  panel.innerHTML = `
    <div class="eyebrow">Era</div>
    <h2>${era.name}</h2>
    <p style="font-style:italic; color:#8a6a48;">${era.range}</p>
    <p>${era.blurb}</p>
    <p class="coords">${PLACES.filter(p=>p.eras.includes(era.id)).length} places marked on the map</p>
  `;
}

function selectPlace(p, marker){
  const tags = p.eras.map(id=>{
    const e = ERA_MAP[id];
    return `<span class="era-tag" style="background:${e.color}">${e.name}</span>`;
  }).join('');
  panel.innerHTML = `
    <div class="eyebrow">Place</div>
    <h2>${p.name}</h2>
    <p>${p.blurb}</p>
    <div>${tags}</div>
  `;
  map.panTo(marker.getLatLng());
}
</script>
</body>
</html>
