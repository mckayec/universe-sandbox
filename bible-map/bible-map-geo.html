<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biblical Lands & Times</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#e9dcbd;
    --land:#ddceA4;
    --ink:#2e2416;
    --sepia:#6b4a2f;
    --sepia-soft:#8a6a48;
    --water:#7fa39c;
    --water-deep:#5c8079;
    --gold:#c0932f;
    --gold-bright:#e0b74f;
    --dot-ot:#a8360f;
    --dot-nt:#4a1f6b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'EB Garamond', serif;
    background:#1c140c;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
    max-width:1400px;
    margin:0 auto;
    background:var(--parchment);
    box-shadow:0 0 80px rgba(0,0,0,0.6);
    overflow:hidden;
  }

  header{
    padding:16px 28px 9px;
    text-align:center;
    border-bottom:1px solid rgba(107,74,47,0.35);
    background:linear-gradient(180deg, rgba(0,0,0,0.06), transparent);
    flex-shrink:0;
  }
  header h1{
    font-family:'Cinzel Decorative', 'Cinzel', serif;
    font-weight:700;
    font-size:clamp(19px, 3vw, 30px);
    letter-spacing:2px;
    margin:0;
  }
  header p{
    font-family:'Cinzel', serif;
    font-size:10.5px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--sepia);
    margin:4px 0 0;
  }

  .stage{ flex:1; display:flex; min-height:0; position:relative; }
  .map-wrap{ flex:1; position:relative; min-width:0; background:var(--water-deep); overflow:hidden; }
  svg#map{ width:100%; height:100%; display:block; cursor:grab; }
  svg#map.grabbing{ cursor:grabbing; }

  .land-path{
    fill:var(--land);
    stroke:var(--sepia);
    stroke-width:0.6;
    stroke-opacity:0.55;
  }
  .lake-path{
    fill:var(--water);
    fill-opacity:0.85;
    stroke:var(--water-deep);
    stroke-width:0.4;
  }
  .river-path{
    fill:none;
    stroke:var(--water-deep);
    stroke-width:1.6;
    stroke-opacity:0.8;
    stroke-linecap:round;
  }
  .sea-label{
    font-family:'Cinzel', serif;
    fill:#eef4f2;
    opacity:0.5;
    letter-spacing:3px;
    pointer-events:none;
  }

  /* ---- Pins: higher-contrast treatment ---- */
  .pin{ cursor:pointer; }
  .pin circle.halo{
    fill:#fffaf0;
    stroke:var(--ink);
    stroke-width:1;
    stroke-opacity:0.55;
    vector-effect:non-scaling-stroke;
    transition:opacity 0.35s ease;
  }
  .pin circle.dot{
    stroke:#fffaf0;
    stroke-width:1.6;
    vector-effect:non-scaling-stroke;
    transition:opacity 0.35s ease, fill 0.35s ease, r 0.2s ease;
    filter:drop-shadow(0 1px 1.5px rgba(0,0,0,0.55));
  }
  .pin circle.ring{
    fill:none;
    stroke:var(--gold-bright);
    stroke-width:0;
    opacity:0;
    vector-effect:non-scaling-stroke;
    transition:all 0.35s ease;
  }
  .pin.selected circle.ring{ stroke-width:2.2; opacity:1; }
  .pin.selected circle.dot{ r:7.5; }
  .pin text.label{
    font-family:'Cinzel', serif;
    font-weight:600;
    fill:var(--ink);
    opacity:0;
    letter-spacing:0.5px;
    transition:opacity 0.25s ease;
    pointer-events:none;
    paint-order:stroke;
    stroke:#fffaf0;
    stroke-width:3.5px;
    stroke-opacity:0.95;
  }
  .pin:hover text.label,
  .pin.selected text.label{ opacity:1; }
  .pin.dim circle.dot,
  .pin.dim circle.halo{ opacity:0.15; }
  .pin.dim text.label{ opacity:0 !important; }

  .compass{ opacity:0.55; pointer-events:none; }
  .compass text{
    font-family:'Cinzel', serif;
    font-size:9px;
    fill:var(--sepia);
    letter-spacing:1px;
  }

  /* journey arrows */
  .journey-path{
    fill:none;
    stroke-width:2.4;
    stroke-linecap:round;
    opacity:0.92;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));
    pointer-events:none;
    vector-effect:non-scaling-stroke;
  }
  .journey-hit{
    fill:none;
    stroke:transparent;
    stroke-width:16;
    cursor:pointer;
    vector-effect:non-scaling-stroke;
  }
  .journey-arrowhead{
    filter:drop-shadow(0 1px 1px rgba(0,0,0,0.4));
  }
  .journey-badge circle{
    stroke:#fffaf0;
    stroke-width:1.2;
    vector-effect:non-scaling-stroke;
    cursor:pointer;
  }
  .journey-badge text{
    font-family:'Cinzel', serif;
    font-size:8px;
    fill:#fffaf0;
    text-anchor:middle;
    dominant-baseline:central;
    pointer-events:none;
  }

  /* floating map tooltip */
  .map-tooltip{
    position:absolute;
    pointer-events:none;
    background:#fffaf0;
    border:1px solid rgba(107,74,47,0.55);
    border-radius:4px;
    padding:7px 11px;
    box-shadow:0 4px 14px rgba(0,0,0,0.3);
    font-family:'EB Garamond', serif;
    font-size:13px;
    color:var(--ink);
    line-height:1.4;
    width:max-content;
    max-width:min(240px, 78vw);
    opacity:0;
    transform:translate(-50%,-100%);
    transition:opacity 0.12s ease;
    z-index:20;
    white-space:normal;
    overflow-wrap:anywhere;
  }
  .map-tooltip.show{ opacity:1; }
  .map-tooltip .tt-title{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:2px;
  }

  .zoom-controls{
    position:absolute;
    right:14px;
    bottom:14px;
    display:flex;
    flex-direction:column;
    gap:4px;
    z-index:5;
  }
  .zoom-controls button{
    width:30px; height:30px;
    border:1px solid rgba(107,74,47,0.5);
    background:rgba(233,220,189,0.92);
    color:var(--ink);
    font-family:'Cinzel', serif;
    font-size:16px;
    border-radius:3px;
    cursor:pointer;
  }
  .zoom-controls button:hover{ background:#fff3da; }

  /* journeys overlay control */
  .journey-controls{
    position:absolute;
    top:14px;
    right:14px;
    z-index:5;
    background:rgba(233,220,189,0.95);
    border:1px solid rgba(107,74,47,0.5);
    border-radius:4px;
    padding:9px 10px;
    max-width:210px;
    box-shadow:0 3px 10px rgba(0,0,0,0.25);
  }
  .journey-controls .eyebrow{
    font-family:'Cinzel', serif;
    font-size:9px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--sepia);
    margin:0 0 6px;
  }
  .journey-controls select{
    width:100%;
    font-family:'EB Garamond', serif;
    font-size:14px;
    padding:5px 6px;
    border:1px solid rgba(107,74,47,0.5);
    border-radius:3px;
    background:#fffaf0;
    color:var(--ink);
  }
  .journey-controls .hint{
    margin-top:6px;
    font-size:11px;
    color:var(--sepia-soft);
    font-style:italic;
    line-height:1.3;
    display:none;
  }
  .journey-controls .hint.show{ display:block; }
  .journey-controls .clear-btn{
    margin-top:6px;
    width:100%;
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:1px;
    padding:5px 6px;
    border:1px solid rgba(107,74,47,0.4);
    border-radius:3px;
    background:rgba(255,255,255,0.4);
    color:var(--sepia);
    cursor:pointer;
    display:none;
  }
  .journey-controls .clear-btn.show{ display:block; }
  .journey-controls .clear-btn:hover{ background:#fff3da; }

  #panel{
    width:300px;
    flex-shrink:0;
    border-left:1px solid rgba(107,74,47,0.35);
    background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(0,0,0,0.03));
    padding:22px 20px;
    overflow-y:auto;
  }
  #panel .eyebrow{
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:var(--gold);
    margin:0 0 6px;
  }
  #panel h2{
    font-family:'Cinzel', serif;
    font-size:21px;
    margin:0 0 10px;
    border-bottom:1px solid rgba(107,74,47,0.3);
    padding-bottom:10px;
  }
  #panel p{ font-size:15.5px; line-height:1.55; color:var(--sepia); margin:0 0 14px; }
  #panel .era-tag{
    display:inline-block;
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:1px;
    padding:4px 9px;
    margin:2px 4px 2px 0;
    border-radius:2px;
    color:var(--parchment);
    opacity:0.9;
  }
  #panel .empty{
    color:var(--sepia-soft);
    font-style:italic;
    font-size:15px;
    margin-top:40px;
    text-align:center;
  }
  #panel .coords{
    font-family:'Cinzel', serif;
    font-size:10px;
    color:var(--sepia-soft);
    letter-spacing:1px;
    margin-top:20px;
  }
  #panel .route{ margin:0; padding:0; list-style:none; }
  #panel .route li.stop{
    display:flex; align-items:baseline; gap:8px;
    font-size:15px; color:var(--ink); padding:3px 0;
  }
  #panel .route li.stop .num{
    font-family:'Cinzel', serif; font-size:11px; color:#fffaf0;
    background:var(--sepia); border-radius:50%;
    width:18px; height:18px; flex:0 0 18px;
    display:flex; align-items:center; justify-content:center;
  }
  #panel .route li.stop .stay{
    display:block; font-size:12.5px; color:var(--sepia-soft); font-style:italic;
  }
  #panel .route li.leg{
    margin:2px 0 2px 9px;
    padding-left:16px;
    border-left:1px dashed rgba(107,74,47,0.5);
    font-size:12.5px;
    color:var(--sepia-soft);
    min-height:20px;
  }
  #panel .route li.leg .leg-note{ font-style:italic; }
  #panel .total-row{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid rgba(107,74,47,0.3);
    font-family:'Cinzel', serif;
    font-size:11px;
    letter-spacing:0.5px;
    color:var(--sepia);
  }
  #panel .deselect-btn{
    margin-top:16px;
    font-family:'Cinzel', serif;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:none;
    border:1px solid rgba(107,74,47,0.45);
    color:var(--sepia);
    padding:6px 12px;
    border-radius:3px;
    cursor:pointer;
  }
  #panel .deselect-btn:hover{ background:rgba(107,74,47,0.1); }

  .timeline{
    flex-shrink:0;
    border-top:1px solid rgba(107,74,47,0.4);
    background:linear-gradient(0deg, rgba(0,0,0,0.08), transparent);
    padding:12px 16px 14px;
  }
  .timeline-inner{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
  }
  .era-tab{
    flex:0 0 auto;
    cursor:pointer;
    border:1px solid rgba(107,74,47,0.4);
    background:rgba(255,255,255,0.15);
    border-radius:3px;
    padding:7px 12px 6px;
    text-align:left;
    min-width:108px;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
    position:relative;
  }
  .era-tab::before{
    content:'';
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--swatch, var(--sepia));
    border-radius:3px 0 0 3px;
  }
  .era-tab .name{ display:block; font-family:'Cinzel', serif; font-size:11px; letter-spacing:0.5px; margin-bottom:2px; }
  .era-tab .range{ display:block; font-size:12px; color:var(--sepia); font-style:italic; }
  .era-tab:hover{ transform:translateY(-2px); }
  .era-tab.active{
    background:rgba(192,147,47,0.22);
    box-shadow:0 0 0 1px var(--gold) inset, 0 3px 10px rgba(0,0,0,0.15);
    transform:translateY(-2px);
  }
  .era-tab.all{ min-width:74px; text-align:center; }
  .era-tab.all::before{ display:none; }

  .timeline-inner::-webkit-scrollbar{ height:6px; }
  .timeline-inner::-webkit-scrollbar-thumb{ background:var(--sepia-soft); border-radius:3px; }
  #panel::-webkit-scrollbar{ width:6px; }
  #panel::-webkit-scrollbar-thumb{ background:var(--sepia-soft); border-radius:3px; }

  @media (max-width: 760px){
    .stage{ flex-direction:column; }
    #panel{ width:100%; border-left:none; border-top:1px solid rgba(107,74,47,0.35); max-height:34vh; }
    .map-wrap{ flex:1 1 50%; }
    header{ padding:10px 16px 7px; }
    .journey-controls{ max-width:150px; font-size:12px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Biblical Lands &amp; Times</h1>
    <p>An atlas of scripture, from Ur to Rome</p>
  </header>

  <div class="stage">
    <div class="map-wrap" id="mapWrap">
      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="map-tooltip" id="tooltip"></div>
      <div class="journey-controls">
        <div class="eyebrow">Journeys</div>
        <select id="journeySelect">
          <option value="">None</option>
        </select>
        <div class="hint" id="journeyHint">Hover or tap an arrow for distance &amp; travel time, or a stop for how long they stayed.</div>
        <button class="clear-btn" id="journeyClear">Clear</button>
      </div>
      <div class="zoom-controls">
        <button id="zoomIn">+</button>
        <button id="zoomOut">&minus;</button>
        <button id="zoomReset">&#8635;</button>
      </div>
    </div>
    <div id="panel">
      <div class="empty">Select a place on the map, choose an era, or trace a journey below.</div>
    </div>
  </div>

  <div class="timeline">
    <div class="timeline-inner" id="timelineInner"></div>
  </div>
</div>

/* ---------------- Distance & travel-time estimate ---------------- */

function haversineMiles(lat1, lon1, lat2, lon2){
  const R = 3958.8; // miles
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// rough ancient travel speeds, for illustrative estimates only
const SPEED_MI_PER_DAY = { land:[15,22], sea:[60,100] };

function travelEstimate(miles, mode){
  const [lo, hi] = SPEED_MI_PER_DAY[mode];
  const dLo = Math.max(1, Math.round(miles / hi));
  const dHi = Math.max(dLo, Math.round(miles / lo));
  const dayStr = dLo === dHi ? `~${dLo} day${dLo===1?'':'s'}` : `~${dLo}\u2013${dHi} days`;
  const modeStr = mode === 'sea' ? 'by sea' : 'on foot / by caravan';
  return `${dayStr} ${modeStr} (estimated)`;
}

const svg = document.getElementById('map');
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) if(attrs[k]!=null) e.setAttribute(k, attrs[k]);
  return e;
}

// pan/zoom viewport
let vb = { x:0, y:0, w:1000, h:500 };
const pinScaleTargets = [];   // {x,y,group} pins
const badgeScaleTargets = []; // {x,y,dx,group} journey stop badges
const arrowScaleTargets = []; // {x,y,angle,group} journey arrowheads

// The svg uses preserveAspectRatio "meet", so the viewBox is letterboxed inside
// the element. All screen<->map math therefore goes through the real screen CTM.
function screenScale(){
  const m = svg.getScreenCTM();
  return m && m.a > 0 ? m.a : 1;           // CSS px per map unit (uniform under "meet")
}
function clientToMap(cx, cy){
  const m = svg.getScreenCTM();
  if(!m) return { x: vb.x + vb.w/2, y: vb.y + vb.h/2 };
  const p = new DOMPoint(cx, cy).matrixTransform(m.inverse());
  return { x:p.x, y:p.y };
}
function mapToClient(x, y){
  const m = svg.getScreenCTM();
  if(!m) return { x:0, y:0 };
  const p = new DOMPoint(x, y).matrixTransform(m);
  return { x:p.x, y:p.y };
}
function setViewBoxAttr(){ svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function applyViewBox(){ setViewBoxAttr(); rescaleUI(); }

// Markers keep a constant on-screen size: counter-scale by the real screen scale.
function rescaleUI(){
  const k = 1 / screenScale();
  pinScaleTargets.forEach(t=> t.group.setAttribute('transform', `translate(${t.x},${t.y}) scale(${k})`));
  badgeScaleTargets.forEach(t=> t.group.setAttribute('transform', `translate(${t.x},${t.y}) scale(${k}) translate(${t.dx-13},-16)`));
  // arrowhead tip sits 8 screen px short of the stop so it doesn't hide under the pin
  arrowScaleTargets.forEach(t=> t.group.setAttribute('transform', `translate(${t.x},${t.y}) rotate(${t.angle}) scale(${k}) translate(-8,0)`));
  if(typeof positionTip === 'function') positionTip();
}
applyViewBox();
if(window.ResizeObserver) new ResizeObserver(()=> rescaleUI()).observe(svg);
window.addEventListener('resize', rescaleUI);

/* ---------------- Tooltip ---------------- */
// One state object keeps identity (key), content, pin state and anchor together.
// The anchor is stored in MAP coordinates so a pinned tooltip follows pan/zoom.

const mapWrap = document.getElementById('mapWrap');
const tooltip = document.getElementById('tooltip');
var tip = { key:null, pinned:false, title:'', html:'', anchor:null };

function positionTip(){
  if(!tip || !tip.key || !tip.anchor) return; // rescaleUI runs once before tip exists
  const c = mapToClient(tip.anchor.x, tip.anchor.y);
  const rect = mapWrap.getBoundingClientRect();
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  const left = Math.min(Math.max(c.x - rect.left, w/2 + 4), Math.max(w/2 + 4, rect.width - w/2 - 4));
  const top = Math.max(c.y - rect.top - 12, h + 4);
  tooltip.style.left = left + 'px';
  tooltip.style.top = top + 'px';
}
function renderTip(){
  tooltip.innerHTML = `<span class="tt-title">${tip.title}</span>${tip.html}`;
  tooltip.classList.add('show');
  positionTip();
}
function clearTip(){
  tip.key = null; tip.pinned = false; tip.anchor = null;
  tooltip.classList.remove('show');
}
// mouse hover: shows a transient tip, but never replaces a pinned one
function hoverTip(key, title, html, evt){
  if(tip.pinned) return;
  tip.key = key; tip.title = title; tip.html = html;
  tip.anchor = clientToMap(evt.clientX, evt.clientY);
  renderTip();
}
function hoverEnd(){ if(!tip.pinned) clearTip(); }
// click / tap: pin this tip, or unpin if it is already the pinned one
function toggleTip(key, title, html, evt){
  if(tip.pinned && tip.key === key){ clearTip(); return; }
  tip.key = key; tip.pinned = true; tip.title = title; tip.html = html;
  tip.anchor = clientToMap(evt.clientX, evt.clientY);
  renderTip();
}
mapWrap.addEventListener('click', (e)=>{
  if(e.target === svg || e.target === bgRect || e.target.closest('.land-path')) clearTip();
});
document.addEventListener('keydown', (e)=>{ if(e.key === 'Escape') clearTip(); });

/* ---------------- Pan & zoom (pointer events: mouse, touch, pen) ---------------- */

svg.style.touchAction = 'none';

// Zoom by `factor` (<1 zooms in) keeping the map point under (cx,cy) fixed on screen.
function zoomAtClient(factor, cx, cy){
  const before = clientToMap(cx, cy);
  const nw = Math.max(6, Math.min(1400, vb.w * factor));
  const ratio = nw / vb.w;
  vb.w *= ratio; vb.h *= ratio;
  setViewBoxAttr();
  const after = clientToMap(cx, cy);
  vb.x += before.x - after.x;
  vb.y += before.y - after.y;
  applyViewBox();
}
function panByClient(dx, dy){
  const s = screenScale();
  vb.x -= dx / s; vb.y -= dy / s;
  applyViewBox();
}

const DRAG_THRESHOLD = 6;           // px of movement before a press becomes a drag
const pointers = new Map();         // id -> {sx,sy,x,y,dragging}
let pinch = null;                   // {dist, mid}
let suppressClick = false;

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function mid(a,b){ return {x:(a.x+b.x)/2, y:(a.y+b.y)/2}; }
function twoPoints(){ return [...pointers.values()].slice(0,2); }

// Listens on the whole svg, so presses that start on pins, badges, or route lines
// can also pan/pinch. A press that never moves past the threshold stays a tap.
svg.addEventListener('pointerdown', (e)=>{
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  suppressClick = false;
  pointers.set(e.pointerId, {sx:e.clientX, sy:e.clientY, x:e.clientX, y:e.clientY, dragging:false});
  if(pointers.size === 2){
    const [a,b] = twoPoints();
    pinch = { dist: dist(a,b), mid: mid(a,b) };
    suppressClick = true;
    pointers.forEach((_,id)=>{ try{ svg.setPointerCapture(id); }catch(_){} });
    pointers.forEach(p=> p.dragging = true);
    svg.classList.add('grabbing');
  }
});

svg.addEventListener('pointermove', (e)=>{
  const p = pointers.get(e.pointerId);
  if(!p) return;
  const lastX = p.x, lastY = p.y;
  p.x = e.clientX; p.y = e.clientY;

  if(pointers.size >= 2 && pinch){
    const [a,b] = twoPoints();
    const nd = dist(a,b), nm = mid(a,b);
    if(nd > 0 && pinch.dist > 0){
      // keep the map point that was under the OLD midpoint under the NEW midpoint
      const before = clientToMap(pinch.mid.x, pinch.mid.y);
      const nw = Math.max(6, Math.min(1400, vb.w * (pinch.dist / nd)));
      const ratio = nw / vb.w;
      vb.w *= ratio; vb.h *= ratio;
      setViewBoxAttr();
      const after = clientToMap(nm.x, nm.y);
      vb.x += before.x - after.x;
      vb.y += before.y - after.y;
      applyViewBox();
    }
    pinch = { dist: nd, mid: nm };
    return;
  }

  if(!p.dragging){
    if(Math.hypot(p.x - p.sx, p.y - p.sy) < DRAG_THRESHOLD) return;
    p.dragging = true;
    suppressClick = true;
    try{ svg.setPointerCapture(e.pointerId); }catch(_){}
    svg.classList.add('grabbing');
    // pan from the point where the drag began, so there is no visible jump
    panByClient(p.x - p.sx, p.y - p.sy);
    return;
  }
  panByClient(p.x - lastX, p.y - lastY);
});

function endPointer(e){
  if(!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
  if(pointers.size >= 2){
    const [a,b] = twoPoints();
    pinch = { dist: dist(a,b), mid: mid(a,b) };
  } else {
    pinch = null;
    // the remaining finger continues as a pan from where it is now
    pointers.forEach(p=>{ p.sx = p.x; p.sy = p.y; p.dragging = true; });
    if(pointers.size === 0) svg.classList.remove('grabbing');
  }
  // the click that follows a drag/pinch release fires right after pointerup
  setTimeout(()=>{ suppressClick = false; }, 0);
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);
svg.addEventListener('lostpointercapture', endPointer);

// swallow the click that ends a drag or pinch so it doesn't select a pin or toggle a tip
svg.addEventListener('click', (e)=>{
  if(suppressClick){ e.stopPropagation(); e.preventDefault(); }
}, true);

svg.addEventListener('wheel', (e)=>{
  e.preventDefault();
  zoomAtClient(e.deltaY > 0 ? 1.12 : 0.89, e.clientX, e.clientY);
}, { passive:false });

function zoomCentre(factor){
  const r = svg.getBoundingClientRect();
  zoomAtClient(factor, r.left + r.width/2, r.top + r.height/2);
}
document.getElementById('zoomIn').addEventListener('click', ()=> zoomCentre(0.8));
document.getElementById('zoomOut').addEventListener('click', ()=> zoomCentre(1.25));
document.getElementById('zoomReset').addEventListener('click', ()=>{ vb = {x:0,y:0,w:1000,h:500}; applyViewBox(); });

function flyTo(targetVb){
  vb = targetVb;
  applyViewBox();
}
function boundsForPlaces(list){
  if(!list.length) return {x:0,y:0,w:1000,h:500};
  const xs = list.map(p=>p.x), ys = list.map(p=>p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const padX = Math.max((maxX-minX)*0.4, 10);
  const padY = Math.max((maxY-minY)*0.4, 10);
  let x = minX-padX, y = minY-padY, w = (maxX-minX)+padX*2, h = (maxY-minY)+padY*2;
  if(h/w < 0.5) h = w*0.5; else if(h/w > 0.5) w = h/0.5;
  // keep a sane minimum extent so a single point or two very close stops
  // still show some surrounding context
  const MIN_EXTENT = 22;
  if(w < MIN_EXTENT){ x -= (MIN_EXTENT-w)/2; w = MIN_EXTENT; }
  if(h < MIN_EXTENT*0.5){ y -= (MIN_EXTENT*0.5-h)/2; h = MIN_EXTENT*0.5; }
  return {x,y,w,h};
}

/* ---------------- Application state ---------------- */

const state = { era:null, journey:null, place:null };

/* ---------------- Timeline UI (with deselect / toggle) ---------------- */

const timelineInner = document.getElementById('timelineInner');

const allTab = document.createElement('button');
allTab.className = 'era-tab all active';
allTab.innerHTML = `<span class="name">All Eras</span>`;
allTab.addEventListener('click', ()=> setEra(null));
timelineInner.appendChild(allTab);

const eraTabEls = {};
ERAS.forEach(era=>{
  const tab = document.createElement('button');
  tab.className = 'era-tab';
  tab.style.setProperty('--swatch', era.color);
  tab.innerHTML = `<span class="name">${era.name}</span><span class="range">${era.range}</span>`;
  tab.addEventListener('click', ()=> setEra(state.era === era.id ? null : era.id));
  timelineInner.appendChild(tab);
  eraTabEls[era.id] = tab;
});

function syncSelection(){
  Object.entries(pinEls).forEach(([name,g])=> g.classList.toggle('selected', name === state.place));
}

function setEra(eraId){
  state.era = eraId;
  state.place = null;
  syncSelection();
  [...timelineInner.children].forEach(c=>c.classList.remove('active'));
  (eraId ? eraTabEls[eraId] : allTab).classList.add('active');
  applyDimming();
  renderPanel();
  if(eraId){
    flyTo(boundsForPlaces(PLACES.filter(p=>p.eras.includes(eraId))));
  } else if(!state.journey){
    flyTo({x:0,y:0,w:1000,h:500});
  }
}

/* ---------------- Journeys UI ---------------- */

const journeySelect = document.getElementById('journeySelect');
const journeyClearBtn = document.getElementById('journeyClear');
const journeyHint = document.getElementById('journeyHint');

JOURNEYS.forEach(j=>{
  const opt = document.createElement('option');
  opt.value = j.id;
  opt.textContent = j.name;
  journeySelect.appendChild(opt);
});
journeySelect.addEventListener('change', ()=> setJourney(journeySelect.value || null));
journeyClearBtn.addEventListener('click', ()=> setJourney(null));

function setJourney(journeyId){
  state.journey = journeyId;
  state.place = null;
  syncSelection();
  journeySelect.value = journeyId || '';
  journeyClearBtn.classList.toggle('show', !!journeyId);
  journeyHint.classList.toggle('show', !!journeyId);
  clearTip();
  drawJourney(journeyId);
  renderPanel();
  if(journeyId){
    const j = JOURNEY_MAP[journeyId];
    flyTo(boundsForPlaces(j.stops.map(s => PLACE_MAP[s.name]).filter(Boolean)));
  } else if(!state.era){
    flyTo({x:0,y:0,w:1000,h:500});
  }
}

// compute leg info (distance + estimate or override) once per journey
function computeLegs(j){
  const pts = j.stops.map(s => PLACE_MAP[s.name]);
  return j.legs.map((leg, i)=>{
    const a = pts[i], b = pts[i+1];
    if(!a || !b) return null;
    const miles = haversineMiles(a.lat, a.lng, b.lat, b.lng);
    const text = leg.mode === 'override'
      ? leg.override
      : `${Math.round(miles).toLocaleString()} mi \u2014 ${travelEstimate(miles, leg.mode)}`;
    return { from:a, to:b, miles:Math.round(miles), mode:leg.mode, text };
  });
}

function stopLabel(j, i){ return j.stops[i].label || j.stops[i].name; }

function drawJourney(journeyId){
  gJourney.innerHTML = '';
  badgeScaleTargets.length = 0;
  arrowScaleTargets.length = 0;
  if(!journeyId) return;
  const j = JOURNEY_MAP[journeyId];
  const pts = j.stops.map(s => PLACE_MAP[s.name]);
  const legInfo = computeLegs(j);
  const bendByPair = new Map(); // a route retraced in reverse bends the same way, so it lands on the other side

  for(let i=0; i<pts.length-1; i++){
    const a = pts[i], b = pts[i+1];
    if(!a || !b) continue;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy) || 1;
    const pairKey = [a.name,b.name].sort().join('|');
    const sign = bendByPair.has(pairKey) ? bendByPair.get(pairKey) : (i % 2 === 0 ? 1 : -1);
    bendByPair.set(pairKey, sign);
    const bend = Math.min(len*0.18, 40) * sign;
    const cx = mx + (-dy/len) * bend;
    const cy = my + (dx/len) * bend;
    const d = `M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}`;

    gJourney.appendChild(el('path', { class:'journey-path', d, stroke:j.color }));

    // manually-drawn arrowhead, kept a constant screen size (rescaleUI sets its transform)
    const angle = Math.atan2(b.y - cy, b.x - cx) * 180 / Math.PI;
    const arrow = el('g', { class:'journey-arrowhead' });
    arrow.appendChild(el('path', { d:'M 0 0 L -11 -4.5 L -7.5 0 L -11 4.5 Z', fill:j.color }));
    gJourney.appendChild(arrow);
    arrowScaleTargets.push({x:b.x, y:b.y, angle, group:arrow});

    // wide invisible hit-path for easy hover/tap, carries the tooltip
    const info = legInfo[i];
    const hit = el('path', { class:'journey-hit', d });
    const key = `leg-${i}`;
    const title = `${stopLabel(j,i)} \u2192 ${stopLabel(j,i+1)}`;
    const html = `<div>${info.text}</div>`;
    hit.addEventListener('pointerenter', (evt)=>{ if(evt.pointerType === 'mouse') hoverTip(key, title, html, evt); });
    hit.addEventListener('pointermove',  (evt)=>{ if(evt.pointerType === 'mouse') hoverTip(key, title, html, evt); });
    hit.addEventListener('pointerleave', (evt)=>{ if(evt.pointerType === 'mouse') hoverEnd(); });
    hit.addEventListener('click', (evt)=>{ evt.stopPropagation(); toggleTip(key, title, html, evt); });
    gJourney.appendChild(hit);
  }

  // numbered stop badges, carrying the "stay" tooltip; a revisited place gets a sideways offset
  const seen = {};
  pts.forEach((p, i)=>{
    if(!p) return;
    const occ = seen[p.name] = (seen[p.name] ?? -1) + 1;
    const dxOff = occ * 15;
    const badge = el('g', {class:'journey-badge'});
    badge.appendChild(el('circle', {cx:0, cy:0, r:6.5, fill:j.color}));
    const t = el('text', {x:0, y:0.5});
    t.textContent = i+1;
    badge.appendChild(t);
    badgeScaleTargets.push({x:p.x, y:p.y, dx:dxOff, group:badge});
    const stay = j.stops[i].stay;
    const key = `stop-${i}`;
    const title = stopLabel(j,i);
    const html = `<div>${stay || 'Duration not recorded.'}</div>`;
    badge.addEventListener('pointerenter', (evt)=>{ if(evt.pointerType === 'mouse') hoverTip(key, title, html, evt); });
    badge.addEventListener('pointermove',  (evt)=>{ if(evt.pointerType === 'mouse') hoverTip(key, title, html, evt); });
    badge.addEventListener('pointerleave', (evt)=>{ if(evt.pointerType === 'mouse') hoverEnd(); });
    badge.addEventListener('click', (evt)=>{ evt.stopPropagation(); toggleTip(key, title, html, evt); });
    gJourney.appendChild(badge);
  });
  rescaleUI();
}

/* ---------------- Dimming (era filter drives pin emphasis) ---------------- */

function applyDimming(){
  PLACES.forEach(p=>{
    const g = pinEls[p.name];
    g.classList.remove('dim');
    const dot = g.querySelector('.dot');
    if(!state.era){
      dot.setAttribute('fill', colorFor(p));
      return;
    }
    if(p.eras.includes(state.era)){
      dot.setAttribute('fill', ERA_MAP[state.era].color);
    } else {
      g.classList.add('dim');
    }
  });
}

/* ---------------- Detail panel ---------------- */

const panel = document.getElementById('panel');

function renderPanel(){
  if(state.place){
    const p = PLACE_MAP[state.place];
    const tags = p.eras.map(id=>{
      const e = ERA_MAP[id];
      return `<span class="era-tag" style="background:${e.color}">${e.name}</span>`;
    }).join('');
    panel.innerHTML = `
      <div class="eyebrow">Place</div>
      <h2>${p.name}</h2>
      <p>${p.blurb}</p>
      <div>${tags}</div>
      <button class="deselect-btn" id="deselectBtn">Deselect</button>
    `;
    document.getElementById('deselectBtn').addEventListener('click', ()=> selectPlace(null));
    return;
  }
  if(state.journey){
    const j = JOURNEY_MAP[state.journey];
    const legInfo = computeLegs(j);
    let totalMiles = 0;
    let rows = '';
    j.stops.forEach((s, i)=>{
      rows += `<li class="stop"><span class="num">${i+1}</span><span><strong>${s.label || s.name}</strong>${s.stay ? `<span class="stay">${s.stay}</span>` : ''}</span></li>`;
      if(i < legInfo.length){
        const info = legInfo[i];
        if(info.mode !== 'override') totalMiles += info.miles;
        rows += `<li class="leg"><span class="leg-note">${info.text}</span></li>`;
      }
    });
    panel.innerHTML = `
      <div class="eyebrow">Journey</div>
      <h2>${j.name}</h2>
      <p>${j.note}</p>
      <ul class="route">${rows}</ul>
      <div class="total-row">~${totalMiles.toLocaleString()} miles of direct-line travel</div>
      <button class="deselect-btn" id="deselectBtn">Clear journey</button>
    `;
    document.getElementById('deselectBtn').addEventListener('click', ()=> setJourney(null));
    return;
  }
  if(state.era){
    const era = ERA_MAP[state.era];
    panel.innerHTML = `
      <div class="eyebrow">Era</div>
      <h2>${era.name}</h2>
      <p style="font-style:italic; color:#8a6a48;">${era.range}</p>
      <p>${era.blurb}</p>
      <p class="coords">${PLACES.filter(p=>p.eras.includes(era.id)).length} places marked on the map</p>
      <button class="deselect-btn" id="deselectBtn">Show all eras</button>
    `;
    document.getElementById('deselectBtn').addEventListener('click', ()=> setEra(null));
    return;
  }
  panel.innerHTML = `<div class="empty">Select a place on the map, choose an era, or trace a journey below.</div>`;
}

function selectPlace(p){
  state.place = p ? p.name : null;
  syncSelection();
  renderPanel();
}

applyDimming();
renderPanel();
</script>
