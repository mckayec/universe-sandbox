<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nearby Worlds</title>
<meta name="description" content="A 3D atlas of the confirmed planetary systems within about 100 light-years of the Sun.">
<link rel="stylesheet" href="../vendor/standalone.css">
<style>
/* Layout follows the Sun Eater / Hyperion atlases: full-bleed WebGL stage, header on top, system index left,
   dossier right (a bottom sheet on phones), and a tour card along the bottom.
   Palette: the black of interstellar space, a cool instrument cyan, and starlight amber. No web fonts (offline). */
:root{
  --void:#03050a;
  --panel:rgba(8,12,20,.88);
  --acc:#8fd3ff;
  --acc-hi:#d4efff;
  --acc-lo:#2c5878;
  --warm:#ffcf8a;
  --hz:#6fe0a0;
  --disp:#ffb062;
  --text:#dfe6ef;
  --muted:#93a2b4;
  --faint:#5d6b7c;
  --line:rgba(160,210,255,.15);
  --line-strong:rgba(160,210,255,.42);
  --f-display:"Didot","Bodoni 72","Bodoni MT","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --f-title:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --f-body:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --f-hud:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --chromegrad:linear-gradient(180deg,#ffffff 0%,#cfeaff 40%,#6fa6cc 64%,#e8f6ff 100%);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--text);font-family:var(--f-body);font-size:16px;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:var(--void)}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}
#c.pointing{cursor:pointer}
button,input{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc-hi);outline-offset:2px}
.vignette{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 58%,rgba(0,0,0,.62) 100%)}
#fade{position:absolute;inset:0;z-index:4;background:var(--void);opacity:0;pointer-events:none;transition:opacity .45s}
#fade.on{opacity:1}
.chrome{background:var(--chromegrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.eyebrow{font:500 10.5px var(--f-hud);letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin:0}
.rule{display:flex;align-items:center;gap:10px;margin:20px 0 10px}
.rule::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid var(--acc);flex:none}
.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-strong),transparent)}
.panel{position:absolute;z-index:5;background:linear-gradient(165deg,rgba(12,18,30,.93),rgba(5,8,14,.9));border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px rgba(200,235,255,.06);border-radius:2px}
.btn{position:relative;background:rgba(8,12,20,.85);border:1px solid var(--line);padding:8px 12px;font:500 11px var(--f-hud);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;backdrop-filter:blur(10px);transition:color .15s,border-color .15s,background .15s;white-space:nowrap}
.btn:hover{color:var(--acc-hi);border-color:var(--line-strong)}
.btn.primary{color:#04121e;background:var(--chromegrad);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn[aria-pressed="true"]{color:var(--acc-hi);border-color:var(--acc)}
.btn .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-left:7px;vertical-align:1px}

/* header */
.top{position:absolute;z-index:6;top:14px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:16px;pointer-events:none}
.brand{display:flex;align-items:center;gap:13px;pointer-events:auto;flex:none;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.sigil{width:44px;height:44px;flex:none;filter:drop-shadow(0 0 10px rgba(140,210,255,.35))}
.brand h1{margin:0;font:600 25px/1 var(--f-display);letter-spacing:.16em}
.brand p{margin:6px 0 0;font:400 10px var(--f-hud);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.brand p b{color:var(--warm);font-weight:500}
.controls{margin-left:auto;display:flex;gap:8px;align-items:center;pointer-events:auto;min-width:0;flex-wrap:wrap;justify-content:flex-end}
.seg{display:flex;border:1px solid var(--line);background:rgba(8,12,20,.85);backdrop-filter:blur(10px);flex:none}
.seg button{background:none;border:0;padding:7px 10px;font:500 10.5px var(--f-hud);letter-spacing:.08em;color:var(--muted);cursor:pointer;border-right:1px solid var(--line);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--acc-hi)}
.seg button[aria-pressed="true"]{color:#04121e;background:var(--chromegrad)}
.seglbl{font:400 9.5px var(--f-hud);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);flex:none}
#idxBtn{display:none}
.sysctl{display:flex;gap:8px;align-items:center}

/* breadcrumb */
#crumbs{position:absolute;z-index:6;top:78px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;font:400 10.5px var(--f-hud);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
#crumbs button{background:none;border:0;padding:3px 0;color:var(--muted);cursor:pointer;letter-spacing:inherit;text-transform:inherit;font:inherit}
#crumbs button:hover{color:var(--acc-hi)}
#crumbs .here{color:var(--acc)}
#crumbs i{font-style:normal;color:var(--acc-lo)}

/* filters */
#filters{top:100px;right:max(16px,env(safe-area-inset-right,0px));width:330px;padding:16px 18px 16px;z-index:9}
#filters h2{margin:0 0 4px}
.fgrp{margin:14px 0 6px;font:400 9.5px var(--f-hud);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.fchip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.02);border:1px solid var(--line);padding:6px 9px;font:400 11px var(--f-hud);letter-spacing:.06em;color:var(--muted);cursor:pointer}
.fchip[aria-pressed="true"]{color:var(--text);border-color:var(--acc);background:rgba(143,211,255,.08)}
.fchip i{width:9px;height:9px;border-radius:50%;flex:none}
.fcount{font:400 10.5px var(--f-hud);color:var(--muted);margin-top:14px;letter-spacing:.06em}
.fcount b{color:var(--acc-hi);font-weight:500}

/* index */
#index{top:100px;left:max(16px,env(safe-area-inset-left,0px));width:252px;padding:14px 10px 12px;max-height:calc(100% - 112px - var(--tb,0px));display:flex;flex-direction:column}
#index h2{margin:0 0 8px 6px}
#idxSearch{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--line);padding:7px 9px;font:400 12px var(--f-hud);color:var(--text);margin-bottom:6px}
#idxSearch::placeholder{color:var(--faint)}
#idxList{overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--acc-lo) transparent;min-height:0}
.grp{margin:12px 6px 5px;font:400 9.5px var(--f-hud);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.sysrow{display:flex;align-items:center;gap:9px;width:100%;background:none;border:1px solid transparent;padding:4px 7px;text-align:left;cursor:pointer;color:var(--text);font:600 15px var(--f-title);letter-spacing:.01em}
.sysrow:hover,.sysrow.hot{border-color:var(--line);background:rgba(143,211,255,.06);color:#fff}
.sysrow.sel{border-color:var(--acc);background:rgba(143,211,255,.1)}
.sysrow.dim{opacity:.32}
.sysrow .sw{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 7px currentColor}
.sysrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sysrow .n{margin-left:auto;font:400 9.5px var(--f-hud);color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* dossier */
#dossier{top:100px;right:max(16px,env(safe-area-inset-right,0px));width:380px;max-height:calc(100% - 112px - var(--tb,0px));overflow-y:auto;padding:18px 20px 20px;scrollbar-width:thin;scrollbar-color:var(--acc-lo) transparent}
#dossier h2{margin:6px 0 2px;font:600 38px/1.02 var(--f-title);letter-spacing:.005em;color:#f2f7fc;text-wrap:balance}
.aka{font:italic 400 14.5px var(--f-body);color:var(--muted);margin:4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{font:400 10px var(--f-hud);letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line);color:var(--muted)}
.chip.hz{border-color:rgba(111,224,160,.55);color:var(--hz)}
.chip.disp{border-color:rgba(255,176,98,.6);color:var(--disp)}
.chip.cls{border-color:rgba(143,211,255,.45);color:var(--acc-hi)}
.chip.meas{border-color:rgba(255,207,138,.55);color:var(--warm)}
.blurb{margin:12px 0 0;line-height:1.55;color:var(--text);font-size:16px;font-weight:400;max-width:62ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:12px 0 0;font-size:14.5px}
.facts dt{font:400 9.5px/2.1 var(--f-hud);letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.facts dd{margin:0;color:var(--text);font-variant-numeric:tabular-nums}
.facts dd small{color:var(--muted);font-size:12.5px}
.facts.meas dd{color:#fff4e2}
.facts.der dd{color:#cfe3f4}
.sect{margin:16px 0 4px;padding:10px 12px 12px;border:1px solid var(--line);background:rgba(255,255,255,.015)}
.sect.meas{border-color:rgba(255,207,138,.32)}
.sect.der{border-color:rgba(143,211,255,.28)}
.sect h3{margin:0;font:500 10px var(--f-hud);letter-spacing:.18em;text-transform:uppercase}
.sect.meas h3{color:var(--warm)}
.sect.der h3{color:var(--acc)}
.sect .sub{margin:4px 0 0;font:italic 400 13px var(--f-body);color:var(--muted)}
.interp{margin:14px 0 0;padding:10px 12px;border-left:2px solid var(--acc);background:rgba(143,211,255,.05);font-size:14px;line-height:1.5;color:var(--text)}
.interp b{font:500 10px var(--f-hud);letter-spacing:.16em;text-transform:uppercase;color:var(--acc);display:block;margin-bottom:3px}
.notes p{margin:8px 0 0;font-size:14px;line-height:1.5;color:var(--text)}
.srcl{margin:8px 0 0;padding-left:18px;font:400 11px/1.5 var(--f-hud);color:var(--muted)}
.srcl li{margin:3px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.plist{display:flex;flex-direction:column;gap:5px}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:rgba(255,255,255,.015);border:1px solid var(--line);padding:7px 10px;cursor:pointer;transition:border-color .15s,background .15s}
.prow:hover,.prow.hot{border-color:var(--line-strong);background:rgba(143,211,255,.05)}
.prow.sel{border-color:var(--acc);background:rgba(143,211,255,.09)}
.prow.disp{border-style:dashed}
.prow .ball{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset -3px -3px 4px rgba(0,0,0,.6)}
.prow .pn{font:600 15.5px var(--f-title);color:#f2f7fc}
.prow .pm{font:400 10px var(--f-hud);color:var(--muted);letter-spacing:.04em;margin-top:2px}
.prow .pb{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.prow .pb span{font:400 9px var(--f-hud);letter-spacing:.08em;text-transform:uppercase;padding:2px 5px;border:1px solid var(--line);color:var(--muted)}
.prow .pb .hz{color:var(--hz);border-color:rgba(111,224,160,.5)}
.prow .pb .ds{color:var(--disp);border-color:rgba(255,176,98,.55)}
.srcnote{margin:16px 0 0;font:400 10px/1.55 var(--f-hud);letter-spacing:.03em;color:var(--faint)}
.tgrad{height:8px;margin:10px 0 4px;background:linear-gradient(90deg,#ff7a3a,#ffb46a,#ffe2b8,#fff6ec,#dfe9ff,#a8c4ff)}
.tscale{display:flex;justify-content:space-between;font:400 9.5px var(--f-hud);color:var(--faint)}
.lgd{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;margin-top:10px;font-size:14px;align-items:center}
.lgd i{display:block;width:22px;height:2px}

/* labels */
#labels{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;background:none;border:0;padding:3px 6px;cursor:pointer;font:600 13.5px var(--f-title);letter-spacing:.04em;color:var(--muted);text-shadow:0 1px 6px #000,0 0 2px #000;transition:color .15s,opacity .25s;will-change:transform}
.lbl:hover,.lbl.hot{color:#fff}
.lbl.sel{color:var(--acc-hi)}
.lbl.major{color:var(--text);font-size:14.5px}
.lbl.land{font:italic 400 12.5px var(--f-body);color:var(--faint);pointer-events:none}
.lbl.sun{font:500 10.5px var(--f-hud);letter-spacing:.2em;text-transform:uppercase;color:var(--warm);pointer-events:none}
.lbl.ring{font:400 9.5px var(--f-hud);letter-spacing:.16em;color:var(--acc-lo);pointer-events:none;text-shadow:none}
.lbl.dir{font:400 9.5px var(--f-hud);letter-spacing:.24em;text-transform:uppercase;color:var(--faint);pointer-events:none}
.plbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;background:none;border:0;padding:3px 5px;cursor:pointer;transition:opacity .25s;will-change:transform}
.plbl .tx{font:600 13px var(--f-title);letter-spacing:.03em;color:#f2f7fc;background:rgba(5,8,14,.74);padding:2px 8px;border:1px solid var(--line);white-space:nowrap}
.plbl.disp .tx{border-style:dashed;color:var(--disp)}
.plbl:hover .tx,.plbl.hot .tx{border-color:var(--acc)}
.plbl.sel .tx{background:var(--chromegrad);color:#04121e;border-color:transparent}

/* tooltip */
#tip{position:absolute;z-index:9;max-width:300px;pointer-events:none;background:linear-gradient(165deg,#0e1624,#05080e);border:1px solid var(--line-strong);padding:10px 13px 11px;box-shadow:0 16px 44px rgba(0,0,0,.7)}
#tip h3{margin:3px 0 2px;font:600 21px var(--f-title);color:#f2f7fc}
#tip p{margin:5px 0 0;font-size:14px;line-height:1.45}
#tip .meta{font:400 10px var(--f-hud);color:var(--muted);letter-spacing:.08em;margin-top:6px;text-transform:uppercase}

/* system HUD */
#hud{position:absolute;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(var(--tb,0px) + 16px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;pointer-events:auto;max-width:calc(100% - 32px)}
#hud .clock{font:400 10.5px var(--f-hud);letter-spacing:.1em;color:var(--muted);background:rgba(8,12,20,.8);border:1px solid var(--line);padding:7px 10px;white-space:nowrap;font-variant-numeric:tabular-nums}
#navhint{position:absolute;z-index:5;top:106px;left:50%;transform:translateX(-50%);font:400 10.5px var(--f-hud);letter-spacing:.08em;color:var(--muted);background:rgba(5,8,14,.72);border:1px solid var(--line);padding:7px 12px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#bake{position:absolute;z-index:6;left:50%;bottom:calc(var(--tb,0px) + 70px);transform:translateX(-50%);font:400 10px var(--f-hud);letter-spacing:.18em;text-transform:uppercase;color:var(--acc);background:rgba(5,8,14,.75);border:1px solid var(--line);padding:6px 11px;pointer-events:none}
#bake b{display:block;height:2px;margin-top:6px;background:var(--acc-lo)}
#bake b i{display:block;height:100%;width:0;background:var(--acc-hi);transition:width .1s}

/* tour */
#tour{position:absolute;z-index:10;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(620px,calc(100% - 32px));padding:14px 18px 14px}
#tour .tt{display:flex;align-items:baseline;gap:12px}
#tour h3{margin:0;font:600 23px var(--f-title);color:#f2f7fc}
#tour .stp{margin-left:auto;font:400 10px var(--f-hud);letter-spacing:.16em;color:var(--muted);white-space:nowrap}
#tour p{margin:8px 0 0;line-height:1.5;font-size:15.5px}
#tour .tb{display:flex;gap:8px;margin-top:12px;align-items:center}
#tour .tb .sp{flex:1}

/* splash */
#splash{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#0c1a2c,var(--void) 70%);transition:opacity 1s;text-align:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
#splash.out{opacity:0;pointer-events:none}
#splash h1{margin:16px 0 0;font:600 clamp(34px,7vw,64px)/1 var(--f-display);letter-spacing:.14em}
#splash p{margin:12px auto 0;max-width:46ch;font:italic 400 17px/1.5 var(--f-body);color:var(--muted)}
#splash .ld{margin-top:22px;font:400 10.5px var(--f-hud);letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
#nogl{position:absolute;inset:0;z-index:40;display:grid;place-items:center;text-align:center;padding:24px;background:var(--void)}

/* mobile */
.grab{display:none}
@media (max-width:1180px){#dossier{width:340px}#index{width:228px}}
@media (max-width:820px){
  .top{top:10px;gap:9px;flex-direction:column;align-items:stretch}
  .brand .sigil{width:34px;height:34px}
  .brand h1{font-size:20px}
  .brand p{font-size:8.5px;letter-spacing:.16em}
  .controls{margin-left:0;flex-wrap:nowrap;justify-content:flex-start;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .controls::-webkit-scrollbar{display:none}
  .seglbl{display:none}
  .seg button{padding:7px 9px}
  #idxBtn{display:inline-flex}
  #crumbs{top:104px;font-size:9.5px;max-width:calc(100% - 32px);overflow:hidden}
  #index{display:none;top:134px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:56%;z-index:12}
  #index.open{display:flex}
  #filters{top:134px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:62%;overflow-y:auto;z-index:12}
  #navhint{top:130px;white-space:normal;width:84%;text-align:center}
  #dossier{top:auto;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:62%;padding:0 16px 16px;z-index:8}
  #dossier.collapsed{overflow:hidden;padding-bottom:0}
  #dossier .grab{display:block;position:sticky;top:0;background:linear-gradient(180deg,rgba(12,18,30,.98),rgba(12,18,30,.92));margin:0 -16px 8px;padding:9px 16px 9px;cursor:pointer;z-index:2;border:0;width:calc(100% + 32px);text-align:left}
  #dossier .grab::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto 7px}
  #dossier .grab span{font:600 18px var(--f-title);color:#f2f7fc}
  #dossier .grab .go{float:right;margin-top:-3px;padding:6px 10px}
  #dossier .grab em{font:400 9.5px var(--f-hud);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:8px}
  #dossier.collapsed>*:not(.grab){display:none}
  #dossier h2{font-size:31px}
  #hud{bottom:calc(var(--sheet,64px) + 14px)}
  #bake{bottom:calc(var(--sheet,64px) + 64px)}
  #tour{bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:12px 14px}
  #tour h3{font-size:20px}
  #tour p{font-size:14.5px}
  .lbl{font-size:12.5px}
  body.touring #dossier{display:none}
  body.touring #hud{bottom:calc(var(--tourh,180px) + 16px)}
}
@media (hover:none),(pointer:coarse){#tip{display:none!important}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="c" aria-label="Three-dimensional map of planetary systems within 100 light-years of the Sun"></canvas>
  <div class="vignette"></div>
  <div id="labels"></div>
  <div id="fade"></div>

  <header class="top">
    <a class="gl-home" href="../" title="Back to the Gravity Lab sandbox"><span aria-hidden="true">←</span> Gravity Lab</a>
    <button class="brand" id="brand" aria-label="Back to the map">
      <svg class="sigil" viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#cfeaff"/><stop offset=".68" stop-color="#6fa6cc"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient></defs>
        <circle cx="24" cy="24" r="20" fill="none" stroke="url(#cg)" stroke-width="1" stroke-dasharray="2 3"/>
        <circle cx="24" cy="24" r="12.5" fill="none" stroke="url(#cg)" stroke-width="1.2"/>
        <circle cx="24" cy="24" r="3.4" fill="#ffcf8a"/>
        <circle cx="36.5" cy="24" r="2.2" fill="#8fd3ff"/>
        <circle cx="10" cy="10" r="1.6" fill="#ffffff"/>
      </svg>
      <div><h1 class="chrome">NEARBY WORLDS</h1><p>Confirmed planets within <b>100 light-years</b></p></div>
    </button>
    <div class="controls" id="controls">
      <button class="btn" id="idxBtn" aria-expanded="false" aria-controls="index">Systems</button>
      <button class="btn" id="filBtn" aria-expanded="false" aria-controls="filters">Filters</button>
      <span class="sysctl" id="sysctl" hidden>
        <span class="seglbl">Scale</span>
        <div class="seg" id="scaleSeg" role="group" aria-label="Orbit scale"><button data-s="vis" aria-pressed="true" title="Orbits spaced and planets enlarged so everything can be seen">Visible</button><button data-s="true" aria-pressed="false" title="Orbits, star and planets all at true relative size">True</button></div>
        <span class="seglbl">Speed</span>
        <div class="seg" id="speedSeg" role="group" aria-label="Orbital speed"><button data-v="0" aria-pressed="false" title="Pause">II</button><button data-v="0.1" aria-pressed="false" title="A tenth of a day per second">0.1d/s</button><button data-v="1" aria-pressed="false" title="One day per second">1d/s</button><button data-v="10" aria-pressed="false" title="Ten days per second">10d/s</button><button data-v="100" aria-pressed="false" title="A hundred days per second">100d/s</button><button data-v="1000" aria-pressed="false" title="About three years per second">1000d/s</button></div>
        <button class="btn" id="hzBtn" aria-pressed="true" title="Show the habitable zone">HZ</button>
      </span>
      <button class="btn" id="mapBtn">Map</button>
      <button class="btn primary" id="tourBtn">Tour</button>
    </div>
  </header>
  <nav id="crumbs" aria-label="Location"></nav>

  <aside class="panel" id="index" aria-label="Planetary systems">
    <h2 class="eyebrow" id="idxTitle">Systems</h2>
    <input id="idxSearch" type="search" placeholder="Search stars and planets" aria-label="Search stars and planets" autocomplete="off">
    <div id="idxList"></div>
  </aside>
  <aside class="panel" id="filters" hidden aria-label="Filters"></aside>
  <aside class="panel" id="dossier" aria-live="polite"></aside>
  <div id="hud" hidden><span class="clock" id="clock"></span></div>
  <div id="navhint"></div>
  <div id="bake" hidden>Generating surface<b><i></i></b></div>
  <div id="tip" hidden></div>
  <section class="panel" id="tour" hidden aria-label="Guided tour"></section>

  <div id="splash">
    <div>
      <svg width="78" height="78" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="20" fill="none" stroke="url(#cg)" stroke-width="1" stroke-dasharray="2 3"/><circle cx="24" cy="24" r="12.5" fill="none" stroke="url(#cg)" stroke-width="1.2"/><circle cx="24" cy="24" r="3.4" fill="#ffcf8a"/><circle cx="36.5" cy="24" r="2.2" fill="#8fd3ff"/></svg>
      <h1 class="chrome">NEARBY WORLDS</h1>
      <p>Every confirmed planetary system within about a hundred light-years of the Sun, placed where it really is.</p>
      <div class="ld" id="splashLd">Charting the neighbourhood</div>
    </div>
  </div>
</div>
<script src="../vendor/three-r128/three.min.js"></script>
<script src="data/nearby.js"></script>
<script src="js/shaders.js"></script>
<script src="js/looks.js"></script>
<script src="js/app.js"></script>
</body>
</html>
