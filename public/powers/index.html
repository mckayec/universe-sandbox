<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../vendor/standalone.css">
<title>Powers of Ten · Gravity Lab</title>
<meta name="description" content="One continuous zoom from inside a proton to the edge of the observable universe, one power of ten at a time.">
<meta name="theme-color" content="#05060a">
<style>
:root{
  --bg:#05060a;--ink:#eef1f6;--ink2:#aab3c2;--ink3:#6f7a8c;--line:rgba(255,255,255,.14);
  --panel:rgba(10,12,18,.72);--accent:#ffc66b;--accent2:#7cc4ff;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:ns-resize}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- top-left readout ---- */
#readout{position:fixed;left:16px;top:calc(12px + var(--safe-t));pointer-events:none;z-index:5;text-shadow:0 1px 8px #000}
#pow{font-family:var(--mono);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1}
#pow sup{font-size:.55em;vertical-align:.75em;margin-left:1px}
#pow .u{font-size:.5em;color:var(--ink2);margin-left:.35em;font-weight:500}
#fam{font-family:var(--mono);font-size:13px;color:var(--ink2);margin-top:6px}
#readout .gl-home{pointer-events:auto;margin-bottom:10px;text-shadow:none}
#title{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}

/* ---- top-right controls ---- */
#ctl{position:fixed;right:12px;top:calc(10px + var(--safe-t));display:flex;gap:8px;z-index:6}
.btn{height:38px;min-width:38px;padding:0 12px;border-radius:19px;background:var(--panel);border:1px solid var(--line);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.btn:hover{border-color:rgba(255,255,255,.3)}
.btn.on{border-color:var(--accent);color:var(--accent)}
.btn svg{width:16px;height:16px;flex:none}
.btn .t{white-space:nowrap}

/* ---- caption card ---- */
#card{position:fixed;left:16px;bottom:calc(16px + var(--safe-b));width:min(440px,calc(100vw - 32px - 44px));z-index:5;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .35s}
#card.fade{opacity:.0}
#name{font-size:19px;font-weight:650;letter-spacing:-.01em;margin:0}
#size{font-family:var(--mono);font-size:12px;color:var(--accent);margin-top:4px}
#cap{font-size:14px;line-height:1.45;color:var(--ink2);margin-top:8px}
#src{font-size:11px;color:var(--ink3);margin-top:8px;display:none}
#card.more #src{display:block}
#cardtog{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:13px;color:var(--ink3);font-size:15px;line-height:26px;text-align:center}

/* ---- scale bar ---- */
#scale{position:fixed;left:16px;z-index:5;pointer-events:none;bottom:calc(16px + var(--safe-b) + var(--cardh,150px) + 12px)}
#bar{height:6px;border:1.5px solid var(--ink);border-top:0;width:100px}
#barl{font-family:var(--mono);font-size:12px;margin-top:5px;color:var(--ink);text-shadow:0 1px 6px #000}

/* ---- right ruler ---- */
#ruler{position:fixed;right:0;top:calc(60px + var(--safe-t));bottom:calc(16px + var(--safe-b));width:44px;z-index:4;touch-action:none;cursor:pointer}
#ruler .trk{position:absolute;right:20px;top:6px;bottom:6px;width:1px;background:var(--line)}
#ruler .tk{position:absolute;right:20px;height:1px;width:6px;background:rgba(255,255,255,.28)}
#ruler .tk.m{width:12px;background:rgba(255,255,255,.5)}
#ruler .tl{position:absolute;right:35px;font-family:var(--mono);font-size:9px;color:var(--ink3);transform:translateY(-50%)}
#ruler .knob{position:absolute;right:14px;width:13px;height:13px;margin-top:-6.5px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}

/* ---- jump list ---- */
#list{position:fixed;right:12px;top:calc(56px + var(--safe-t));bottom:calc(16px + var(--safe-b));width:min(320px,calc(100vw - 24px));z-index:7;
  background:rgba(8,10,15,.92);border:1px solid var(--line);border-radius:14px;overflow:auto;display:none;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);overscroll-behavior:contain}
#list.open{display:block}
#list h3{margin:0;padding:14px 16px 8px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);position:sticky;top:0;background:rgba(8,10,15,.96)}
#list button{display:flex;width:100%;text-align:left;padding:8px 16px;gap:12px;align-items:baseline;border-top:1px solid rgba(255,255,255,.05)}
#list button:hover{background:rgba(255,255,255,.05)}
#list button.cur{background:rgba(255,198,107,.1)}
#list .e{font-family:var(--mono);font-size:12px;color:var(--accent);width:44px;flex:none;text-align:right}
#list .n{font-size:14px}
#list .s{display:block;font-size:11px;color:var(--ink3);margin-top:2px}

/* ---- labels in the scene ---- */
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;font-size:11.5px;color:#dfe6f2;white-space:nowrap;text-shadow:0 0 4px #000,0 0 10px #000;
  padding-left:9px;will-change:transform,opacity}
.lbl::before{content:"";position:absolute;left:0;top:50%;width:5px;height:1px;background:currentColor;opacity:.7}
.lbl.here{color:var(--accent)}

#travel{position:fixed;left:50%;top:62%;transform:translate(-50%,-50%);max-width:calc(100% - 32px);text-align:center;z-index:4;pointer-events:none;opacity:0;font-family:var(--mono);font-size:13px;letter-spacing:.08em;color:var(--ink2);white-space:nowrap;text-shadow:0 1px 8px #000}
#travel .au{display:inline-block;margin:0 .6em;padding:3px 10px;border:1px dashed rgba(255,213,138,.6);border-radius:999px;color:var(--accent)}
#travel .arr{color:var(--accent)}
@media (max-width:520px){#travel{font-size:11px;white-space:normal;line-height:2.1}}
#hint{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:4;pointer-events:none;text-align:center;
  font-size:14px;color:var(--ink2);background:rgba(5,6,10,.6);padding:10px 16px;border-radius:12px;transition:opacity .8s;text-shadow:0 1px 6px #000}
#hint b{color:var(--ink);font-weight:600}
#hint.gone{opacity:0}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:var(--bg);color:var(--ink2);font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:opacity .6s}
#load.gone{opacity:0;pointer-events:none}
#err{position:fixed;left:16px;right:16px;top:40%;z-index:30;text-align:center;color:#ffb4a8;display:none}

@media (max-width:640px){
  #pow{font-size:28px}
  #fam{font-size:12px}
  #title{display:none}
  .btn .t{display:none}
  .btn{padding:0;width:38px;justify-content:center}
  #card{left:10px;right:50px;width:auto;bottom:calc(10px + var(--safe-b));padding:11px 13px}
  #name{font-size:16px}
  #cap{font-size:13px;line-height:1.4;margin-top:6px}
  #scale{left:12px;bottom:calc(10px + var(--safe-b) + var(--cardh,130px) + 10px)}
  #readout{left:12px}
  #ruler{width:40px}
  #ruler .tl{display:none}
}
@media (max-height:520px) and (orientation:landscape){
  #cap{display:none}
  #card.more #cap{display:block}
}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Zoomable view from subatomic to cosmic scales"></canvas>
<div id="labels" aria-hidden="true"></div>

<div id="readout">
  <a class="gl-home" href="../" title="Back to the Gravity Lab sandbox"><span aria-hidden="true">←</span> Gravity Lab</a>
  <div id="title">Powers of Ten</div>
  <div id="pow">10<sup>0</sup><span class="u">m</span></div>
  <div id="fam">1 metre</div>
</div>

<div id="ctl">
  <button class="btn" id="bIn" title="Auto-play the journey inwards, down to the quarks" aria-label="Auto-play inwards">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4"/></svg><span class="t">Journey in</span></button>
  <button class="btn" id="bOut" title="Auto-play the journey outwards, to the edge of the observable universe" aria-label="Auto-play outwards">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5M5 7h4M7 5v4"/></svg><span class="t">Journey out</span></button>
  <button class="btn" id="bList" title="Jump to a scale" aria-label="Jump to a scale" aria-expanded="false">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4h12M2 8h12M2 12h12"/></svg><span class="t">Scales</span></button>
</div>

<div id="scale" aria-hidden="true"><div id="bar"></div><div id="barl">1 m</div></div>

<div id="card" aria-live="polite">
  <button id="cardtog" title="Sources and notes" aria-label="Show sources">i</button>
  <h2 id="name">Person</h2>
  <div id="size"></div>
  <div id="cap"></div>
  <div id="src"></div>
</div>

<div id="ruler" role="slider" tabindex="0" aria-label="Scale" aria-valuemin="-16" aria-valuemax="27" aria-valuenow="0"><div class="trk"></div></div>
<div id="list" role="dialog" aria-label="Jump to a scale"><h3>Jump to a scale</h3></div>
<div id="travel" aria-hidden="true">Leaving Earth <span class="au">1 AU · 150 million km</span> to the Sun <span class="arr">→</span></div>
<div id="hint"><b>Scroll</b>, <b>pinch</b> or <b>drag up/down</b> to zoom<br>or press <b>Journey</b></div>
<div id="load">Loading…</div>
<div id="err"></div>

<script src="../vendor/three-r128/three.min.js"></script>
<script src="../vendor/standalone.js"></script>
<script src="stops.js"></script>
<script src="earth-land.js"></script>
<script src="powers.js"></script>
</body>
</html>
